name: Build OpenTTD Android (arm64 Debug)

on:
  workflow_dispatch:
  push:
    branches: [ sdl_android ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: openttd
      ARCH_LIST: arm64-v8a          # Build only arm64
      ANDROID_BUILD_TOOLS: 35.0.0   # Adjust if needed

    steps:
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Follow the reference workflow: shallow checkout, no submodules yet
          fetch-depth: 1
          submodules: false

      - name: Init required submodules (shallow, selective)
        # Match the original workflow's style: only init the needed submodules with --depth=1
        run: >
          git submodule update --init --recursive --depth=1
          project/jni/application/${APP_NAME}
          project/jni/iconv/src
          project/jni/sdl2 project/jni/sdl2_image
          project/jni/sdl2_mixer project/jni/sdl2_ttf

      - name: Symlink application dir
        run: ln -s ${APP_NAME} project/jni/application/src

      - name: Set architectures list (arm64 only)
        run: sed -i "s/MultiABI=.*/MultiABI='${ARCH_LIST}'/g" project/jni/application/src/AndroidAppSettings.cfg

      # === ICU cache (copied from the reference workflow) ===

      - name: Compute ICU cache key
        id: icu-rev
        run: echo "ICU_REV=`git -C project/jni/iconv/src rev-parse HEAD`::`echo ${ARCH_LIST} | sed 's/ /:/g'`" >> $GITHUB_ENV

      - name: Restore ICU build cache
        uses: actions/cache@v4
        id: cache-icu
        with:
          # Same SDL/iconv revision + ARCH_LIST should reproduce identical ICU outputs
          key: ${{ env.ICU_REV }}
          path: |
            project/jni/iconv/include
            project/jni/iconv/lib
            project/jni/icuuc/include
            project/jni/icuuc/lib
            project/jni/icuuc/share/icu

      - name: Touch cached ICU timestamps (if cache hit)
        if: steps.cache-icu.outputs.cache-hit == 'true'
        run: |
          touch project/jni/iconv/lib/*/* project/jni/icuuc/lib/*/* project/jni/icuuc/share/icu/*/* || true

      # === Follow your flow afterwards ===

      - name: Patch Java files and build Boost, ICU, and OpenSSL
        run: |
          export PATH=$ANDROID_NDK_LATEST_HOME:$PATH
          ./changeAppSettings.sh

      - name: Set up Gradle and Android SDK licenses
        working-directory: project
        run: |
          # Accept licenses in the global SDK
          for Y in `seq 20`; do echo y; done | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          # Bootstrap Gradle once (non-fatal)
          ./gradlew assembleRelease || true
          # Accept licenses again with sdk_root pointing to this project
          for Y in `seq 20`; do echo y; done | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=`pwd`
          # Ensure debug keystore exists
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=Debug"
          # Project-local SDK and proguard configs (mirrors the reference)
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "proguard.config=proguard.cfg;proguard-local.cfg" >> local.properties

      - name: Build (Debug) via build.sh
        run: |
          export PATH=$ANDROID_NDK_LATEST_HOME:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH
          ./build.sh
          ls -al project/bin || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTTD-arm64-debug-apk
          path: project/bin/MainActivity-debug.apk
          if-no-files-found: error
