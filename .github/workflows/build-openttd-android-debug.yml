name: Build OpenTTD Android (arm64 Debug)

on:
  workflow_dispatch:
  push:
    branches: [ sdl_android ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: openttd
      ARCH_LIST: arm64-v8a          # Build only arm64
      ANDROID_BUILD_TOOLS: 35.0.0   # Adjust if needed

    steps:
      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep full history to reliably resolve submodule SHAs
          fetch-depth: 0
          submodules: false

      - name: Init submodules (follow superproject commits)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Symlink application dir
        run: ln -s ${APP_NAME} project/jni/application/src

      - name: Set architectures list (arm64 only)
        run: sed -i "s/MultiABI=.*/MultiABI='${ARCH_LIST}'/g" project/jni/application/src/AndroidAppSettings.cfg

      # === STRICTLY FOLLOW YOUR FLOW FROM HERE ===

      - name: Patch Java files and build Boost, ICU, and OpenSSL
        run: |
          export PATH=$ANDROID_NDK_LATEST_HOME:$PATH
          ./changeAppSettings.sh

      - name: Set up Gradle and Android SDK licenses
        working-directory: project
        run: |
          # Accept licenses in the global SDK
          for Y in `seq 20`; do echo y; done | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
          # Kick Gradle once (non-fatal) to bootstrap wrapper/deps
          ./gradlew assembleRelease || true
          # Accept licenses again with sdk_root set to this project (mirrors the template)
          for Y in `seq 20`; do echo y; done | sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=`pwd`
          # Ensure a debug keystore exists (even though we only need debug output)
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=Debug"
          # Point local.properties at the SDK and proguard configs (same as template)
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "proguard.config=proguard.cfg;proguard-local.cfg" >> local.properties

      - name: Build (Debug) via build.sh
        run: |
          export PATH=$ANDROID_NDK_LATEST_HOME:$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}:$PATH
          ./build.sh
          ls -al project/bin || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTTD-arm64-debug-apk
          path: project/bin/MainActivity-debug.apk
          if-no-files-found: error
